# ===============================
# Server Configuration
# ===============================
# Render ya kisi bhi cloud provider ke liye dynamic port handling
server.address=0.0.0.0
server.port=${PORT:9090}
spring.application.name=piet-quizhub-backend

# ===============================
# MySQL (Aiven)
# ===============================
# SSL Mode required for Aiven Cloud
spring.datasource.url=jdbc:mysql://piet-quizhub-piet-quizhub.i.aivencloud.com:14576/quizhub?sslMode=REQUIRED
spring.datasource.username=quizhub_user
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Settings
# ===============================
# Virtual Threads enabled for high concurrency (1500+ users)
spring.threads.virtual.enabled=true
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.generate-ddl=true

# ===============================
# HikariCP (Connection Pooling)
# ===============================
# 1500 users ke liye pool size ko optimized rakha hai
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# Tomcat Tuning (Performance)
# ===============================
# Threads limit for high load handling
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=2000
server.tomcat.max-connections=20000

# ===============================
# Redis (Redis Labs / Aiven)
# ===============================
spring.cache.type=redis
spring.data.redis.host=redis-16017.crce206.ap-south-1-1.ec2.cloud.redislabs.com
spring.data.redis.port=16017
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true

# ===============================
# Gemini AI & External APIs
# ===============================
# Key ko variable mein rakha hai taaki GitHub pe leak na ho
gemini.api.key=${GEMINI_API_KEY}

# ===============================
# File Uploads (Excel Bulk Upload)
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# Logging & Debugging
# ===============================
# 403 Forbidden errors check karne ke liye
logging.level.org.springframework.security=DEBUG

#
# ===============================
# Password Reset Email Configuration
# ===============================
# Gmail SMTP server configuration for sending password reset emails
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=pietquizhub@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true



# ===============================
# JWT Secret Key (for password reset tokens)
# ===============================
# Is secret key ko strong aur lamba rakha hai taaki security compromised na ho
# jwt.secret=TeraSecretKeyJoBohotLambiHoniChahiye1234567890